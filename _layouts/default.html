<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en_US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 760px; margin: 0 auto; padding: 24px 20px 72px; color: #1a1a1a; background: #fff;
    }
    header.site { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
    header.site a { color: #0645ad; text-decoration: none; font-weight: 600; }
    header.site .views { flex: 0 0 auto; height: 20px; }
    h1 { font-size: 2rem; line-height: 1.2; margin: .4em 0 .3em; }
    h2 { font-size: 1.4rem; margin: 1.6em 0 .5em; }
    h3 { font-size: 1.15rem; margin: 1.3em 0 .4em; }
    a { color: #0645ad; }
    table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: .95rem; }
    th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; }
    th { background: #f6f8fa; }
    blockquote {
      border-left: 4px solid #2b7a2b; background: #f3faf3; margin: 1.4em 0;
      padding: 12px 18px; border-radius: 4px;
    }
    blockquote h3 { margin-top: 0; }
    code { background: #f0f2f4; padding: 2px 6px; border-radius: 4px; font-size: .9em; }
    .video-embed {
      position: relative; width: 100%; padding-top: 56.25%; margin: 1.2em 0;
      border-radius: 8px; overflow: hidden; background: #000;
    }
    .video-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    nav.crumbs { font-size: .9rem; margin: 0 0 1em; color: #666; }
    footer.site { margin-top: 48px; padding-top: 20px; border-top: 1px solid #eee; font-size: .9rem; color: #666; }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #e6edf3; }
      a, header.site a { color: #6cb6ff; }
      th { background: #161b22; } th, td { border-color: #30363d; }
      blockquote { background: #12261a; border-left-color: #3fb950; }
      code { background: #161b22; }
    }
  </style>
</head>
<body>
  <header class="site">
    <a href="{{ site.baseurl }}/">RoxyBrowser Guides</a>
    {% assign vc = page.url | split: '/' | join: '/' %}
    <img class="views" src="https://hits.sh/alexmorganxx.github.io/roxybrowser-guide{{ vc }}.svg?style=flat-square&label=views&color=2b7a2b" alt="Page view count" loading="lazy" height="20">
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site">
    <p><a href="{{ site.baseurl }}/">All guides</a> · Independent tutorials for RoxyBrowser and antidetect browsing.</p>
  </footer>
</body>
</html>
